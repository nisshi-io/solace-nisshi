[package]
name = "nisshi-storage"
description = "Storage abstraction for PostgreSQL, libSQL and ObjectStore (S3 or memory)"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["dynostore", "libsql", "postgres", "slatedb", "turso"]
dynostore = ["dep:object_store"]
libsql = ["dep:libsql", "dep:deadpool"]
postgres = ["dep:tokio-postgres", "dep:deadpool", "dep:deadpool-postgres", "dep:tokio-postgres-rustls"]
slatedb = ["dep:object_store", "dep:postcard", "dep:slatedb"]
turso = ["dep:turso"]

# docs.rs builds with nightly, where `branches` 0.4 (a dependency of turso) no longer
# compiles. Remove this table once turso depends on `branches` 0.5.
# https://github.com/nisshi-io/solace-nisshi/issues/1045
[package.metadata.docs.rs]
no-default-features = true
features = ["dynostore", "libsql", "postgres", "slatedb"]

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
console.workspace = true
deadpool = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
futures-core.workspace = true
futures-util.workspace = true
futures.workspace = true
glob.workspace = true
governor.workspace = true
human-units.workspace = true
indicatif.workspace = true
libsql = { workspace = true, optional = true }
nisshi-sans-io.workspace = true
nisshi-schema.workspace = true
object_store = { workspace = true, optional = true }
opentelemetry-semantic-conventions.workspace = true
opentelemetry.workspace = true
postcard = { workspace = true, optional = true }
protobuf.workspace = true
rama.workspace = true
rand.workspace = true
regex.workspace = true
rsasl.workspace = true
rustls-native-certs.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
slatedb = {workspace = true, optional = true}
thiserror.workspace = true
tokio-postgres = { workspace = true, optional = true }
tokio-postgres-rustls = { workspace = true, optional = true }
tokio-util.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
turso = { workspace = true, optional = true }
url.workspace = true
uuid.workspace = true

[dev-dependencies]
criterion.workspace = true
dotenv.workspace = true
nisshi-schema.workspace = true
opentelemetry_sdk.workspace = true
