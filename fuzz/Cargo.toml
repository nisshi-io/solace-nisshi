[package]
name = "fuzz"
edition = "2024"
license = "Apache-2.0"
publish = false
version = "0.0.0"

[package.metadata]
cargo-fuzz = true

# A workspace of its own rather than a member of the root one, so the root's
# `cargo metadata`, which FOSSA and cargo-deny read, leaves out libfuzzer-sys.
# It has its own Cargo.lock, which Dependabot updates with the root one.
[workspace]

# bytes, rama, tokio and url repeat the requirements in the root Cargo.toml's
# [workspace.dependencies]; change both together.

[dependencies]
bytes = { version = "1", features = ["serde"] }
libfuzzer-sys = "0.4"
nisshi-fuzz-harness = { path = "../nisshi-fuzz-harness", default-features = false }
nisshi-sans-io = { path = "../nisshi-sans-io", default-features = false, features = ["arbitrary"] }
nisshi-service = { path = "../nisshi-service", default-features = false }
nisshi-storage-dynostore = { path = "../nisshi-storage-dynostore", default-features = false }
nisshi-storage = { path = "../nisshi-storage", default-features = false }
rama = { version = "0.4.0", features = ["http", "tcp"] }
tokio = { version = "1", features = ["full", "test-util"] }
url = { version = "2.5.4", features = ["serde"] }

[[bin]]
name = "generate_seeds"
path = "fuzz_targets/generate_seeds.rs"

[[bin]]
name = "fuzz_request_decode"
path = "fuzz_targets/fuzz_request_decode.rs"
test = false
doc = false
bench = false

