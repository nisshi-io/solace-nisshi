[lints]

# Cargo reads profiles from the workspace root only, so the root Cargo.toml's
# release profile doesn't reach this workspace. One codegen unit, as there:
# with more, nightly rustc segfaults on typenum with the sanitizer. No LTO:
# with it every target generates the machine code for its whole dependency
# graph when it links, which takes minutes per target, and the targets run
# fewer inputs per second.
[profile.release]
codegen-units = 1
lto = false
