[package]
name = "nisshi-broker"
description = "Nisshi Apache Kafka®-compatible broker"
authors.workspace = true
edition.workspace = true
homepage.workspace = true
include.workspace = true
keywords.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[features]
default = ["dynostore", "libsql", "postgres", "slatedb", "turso"]
dynostore = ["dep:nisshi-storage-dynostore"]
libsql = ["dep:nisshi-storage-sql", "nisshi-storage-sql/libsql"]
postgres = ["dep:nisshi-storage-sql", "nisshi-storage-sql/postgres"]
slatedb = ["dep:nisshi-storage-slatedb"]
turso = ["dep:nisshi-storage-sql", "nisshi-storage-sql/turso"]

# docs.rs builds with nightly, where `branches` 0.4 (a dependency of turso) no longer
# compiles. Remove this table once turso depends on `branches` 0.5.
# https://github.com/nisshi-io/solace-nisshi/issues/1045
[package.metadata.docs.rs]
no-default-features = true
features = ["dynostore", "libsql", "postgres", "slatedb"]

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
clap.workspace = true
console.workspace = true
futures.workspace = true
glob.workspace = true
http-body-util.workspace = true
human-units.workspace = true
humantime.workspace = true
hyper-util.workspace = true
hyper.workspace = true
indicatif.workspace = true
jsonschema.workspace = true
libc.workspace = true
nisshi-auth.workspace = true
nisshi-model.workspace = true
nisshi-otel.workspace = true
nisshi-sans-io.workspace = true
nisshi-schema.workspace = true
nisshi-service.workspace = true
nisshi-storage-dynostore = { workspace = true, optional = true }
nisshi-storage-null.workspace = true
nisshi-storage-slatedb = { workspace = true, optional = true }
nisshi-storage-sql = { workspace = true, optional = true }
nisshi-storage.workspace = true
opentelemetry-semantic-conventions.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
rama.workspace = true
rand.workspace = true
regex.workspace = true
rsasl.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
socket2.workspace = true
