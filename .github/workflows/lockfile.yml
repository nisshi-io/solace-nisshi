---
name: Lockfile

# Fails a pull request whose Cargo.lock moves a package or a dependency edge
# to a lower version, unless its description has an
# `allow-lock-downgrade: <crate>` line for that crate. `cargo update -p` can
# re-point crates that it was not asked to update at older copies already in
# the lockfile (rust-lang/cargo#14446); see .github/scripts/check-lock-downgrade.py.
#
# No `paths:` filter: a required check that's path-filtered never reports on
# a PR outside that path and blocks it forever instead of passing it. The step
# skips each lockfile that the PR does not change.
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    # `edited` runs the check again when the description changes, so an
    # acknowledgement needs no manual re-run.
    types: [opened, synchronize, reopened, edited]
  # The merge queue needs each required check on its entries too. The PR run
  # already compared the lockfiles with main, so the entry passes unchecked.
  merge_group:
    types: [checks_requested]

concurrency:
  group: lockfile-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lock-downgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The PR's merge commit and its first parent, the base it compares with.
          fetch-depth: 2
      # The description reaches the script only through the environment, never
      # through `run:`, so its text cannot run as shell.
      - name: Check the lockfiles for downgrades
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          python3 --version
          python3 -I .github/scripts/check-lock-downgrade.test.py
          rc=0
          for lock in Cargo.lock fuzz/Cargo.lock; do
            if git diff --quiet HEAD^1 HEAD -- "$lock"; then continue; fi
            # A lockfile that the PR adds or deletes has nothing to compare.
            if ! git cat-file -e "HEAD^1:$lock" 2>/dev/null || [ ! -f "$lock" ]; then continue; fi
            git show "HEAD^1:$lock" > "$RUNNER_TEMP/base.lock"
            r=0
            python3 -I .github/scripts/check-lock-downgrade.py "$RUNNER_TEMP/base.lock" "$lock" || r=$?
            # Exit 2 (could not run) outranks exit 1 (downgrade found).
            if [ "$r" -gt "$rc" ]; then rc=$r; fi
          done
          if [ "$rc" -eq 1 ]; then
            echo "::error::Cargo.lock moves the edges above to lower versions. Repair it with .github/scripts/check-lock-downgrade.py --restore <base lockfile> Cargo.lock, or add an allow-lock-downgrade: <crate> line to the PR description."
          fi
          exit "$rc"
