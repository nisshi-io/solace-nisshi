version: 3

project:
  locator: nisshi-io_nisshi
  id: nisshi-io_nisshi
  name: nisshi
  # FOSSA applies this only when it creates the project.
  policy: Solace-Distributed-Standard
  teams: []
  labels: []

vendoredDependencies:
  forceRescans: false
  scanMethod: CLILicenseScan
  licenseScanPathFilters:
    exclude:
      - "./.git"
      - "./.github"
      - "./.devcontainer"
      - "./compat"
      - "./demo"
      - "./docs"
      - "./etc"
      - "./fuzz"

# FOSSA's cargo strategy runs `cargo metadata` on the root Cargo.toml, which
# reports every member of the workspace, and doesn't look for a Cargo.toml
# below it. So these paths can't take a crate out of the scan; fuzz/ stays out
# because it is a workspace of its own, not a member of the root one.
paths:
  exclude:
    - ./.git
    - ./.github
    - ./.devcontainer
    - ./compat
    - ./demo
    - ./docs
    - ./etc
    - ./fuzz

telemetry:
  scope: full
