[package]
name = "nisshi-storage-integration-test"
description = "Tests of Nisshi's broker running on top of a storage engine that the caller supplies"
publish = false
edition.workspace = true
version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
authors.workspace = true
include.workspace = true
rust-version.workspace = true

# A case runs on the engine that its caller passes in, so the crate does not depend on an engine
# crate or on an engine feature of `nisshi-broker`. `tests/it/dependencies.rs` checks it.
[dependencies]
anyhow.workspace = true
async-trait.workspace = true
bytes.workspace = true
nisshi-broker.workspace = true
nisshi-sans-io.workspace = true
nisshi-service.workspace = true
nisshi-storage.workspace = true
rama.workspace = true
rand.workspace = true
tokio-util.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
# Only `tests/it/outside_caller.rs` uses an engine crate, to build its own engine as a caller
# does. A dev-dependency is not passed on to the crate's callers.
nisshi-storage-dynostore.workspace = true
proc-macro2.workspace = true
syn.workspace = true

[lints]
workspace = true
