 syntax = 'proto3';

 enum Corpus {
   CORPUS_UNSPECIFIED = 0;
   CORPUS_UNIVERSAL = 1;
   CORPUS_WEB = 2;
   CORPUS_IMAGES = 3;
   CORPUS_LOCAL = 4;
   CORPUS_NEWS = 5;
   CORPUS_PRODUCTS = 6;
   CORPUS_VIDEO = 7;
 }

 message Value {
   string query = 1;
   int32 page_number = 2;
   int32 results_per_page = 3;
   Corpus corpus = 4;
 }
